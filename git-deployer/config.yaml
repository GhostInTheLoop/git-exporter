name: Home Assistant Git Deployer (private)
version: 1.2.0
slug: git-deployer
description: Safely deploy automations, scripts, scenes and dashboards from a git branch into Home Assistant
url: https://github.com/GhostInTheLoop/git-exporter-Private
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
# No `image:` key on purpose: Home Assistant builds this add-on locally from the Dockerfile.
homeassistant_api: true
map:
  - type: config
    read_only: false
options:
  repository:
    url: ''
    username: ''
    password: ''
    branch: deploy
  dry_run: true
  poll_interval: 0
  reload: true
  keep_backups: 20
  deploy_configuration: false
schema:
  repository:
    url: match(https://.*)
    username: str
    password: password
    branch: str
  dry_run: bool
  poll_interval: int(0,86400)
  reload: bool
  keep_backups: int(1,200)
  deploy_configuration: bool?
