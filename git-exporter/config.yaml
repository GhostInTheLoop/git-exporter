name: Home Assistant Git Exporter (private)
version: 2.1.0
slug: git-exporter
description: Export your Home Assistant configuration to a git repository you control
url: https://github.com/GhostInTheLoop/git-exporter-Private
arch:
  - aarch64
  - amd64
startup: once
boot: manual
init: false
# No `image:` key on purpose: Home Assistant builds this add-on locally from the Dockerfile.
# hassio_api/hassio_role are only needed for export.addons (reads other add-ons' options).
hassio_api: true
hassio_role: manager
map:
  - type: config
    read_only: true
options:
  repository:
    url: ''
    username: ''
    password: ''
    pull_before_push: true
    commit_message: Home Assistant Git Exporter
    branch_name: main
  export:
    lovelace: true
    addons: false
    registry: false
    esphome: true
    node_red: true
  check:
    enabled: true
    check_for_secrets: true
    check_for_ips: true
  include: []
  exclude:
    - '*.db'
    - '*.log*'
    - __pycache__
    - ._*
    - .DS_Store
    - deps/
    - known_devices.yaml
    - tts/
    - '*.db-shm'
    - '*.db-wal'
    - '*.gz'
  secrets: []
  allowed_secrets: []
  dry_run: false
schema:
  repository:
    url: match(https://.*)
    email: match(.+@.+)?
    username: str
    password: password
    pull_before_push: bool
    commit_message: str
    branch_name: str
    ssl_verification: bool?
  export:
    lovelace: bool
    addons: bool
    registry: bool?
    esphome: bool
    node_red: bool
  check:
    enabled: bool
    check_for_secrets: bool
    check_for_ips: bool
  include:
    - str
  exclude:
    - str
  secrets:
    - str
  allowed_secrets:
    - str
  dry_run: bool
